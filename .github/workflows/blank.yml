name: Build STIPHANTUBE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        working-directory: STIPHANTUBE_ANDROID
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: STIPHANTUBE_ANDROID
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STIPHANTUBE-debug-apk
          path: STIPHANTUBE_ANDROID/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
