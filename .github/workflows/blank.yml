name: Build STIPHANTUBE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          if [ -f "STIPHANTUBE_ANDROID/gradlew" ]; then
            echo "Android project already extracted."
          else
            echo "Searching ZIP files..."
            ZIP_FILE=""

            for z in $(find . -type f -name "*.zip"); do
              if unzip -l "$z" | grep -q "STIPHANTUBE_ANDROID/gradlew"; then
                ZIP_FILE="$z"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP not found."
              find . -maxdepth 3 -type f | head -200
              exit 1
            fi

            echo "Found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Make Gradle executable
        run: chmod +x STIPHANTUBE_ANDROID/gradlew

      - name: Build Debug APK
        working-directory: STIPHANTUBE_ANDROID
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STIPHANTUBE-debug-apk
          path: STIPHANTUBE_ANDROID/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
